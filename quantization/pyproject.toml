[project]
name = "rsmllm-quant"
version = "0.1.0"
description = "RS-MLLM 量化转换环境: llmcompressor 0.13 + torch 2.11 cu129 (与评测/推理环境隔离)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "llmcompressor==0.13.0",
    "transformers>=5.12.0",
    "accelerate>=1.14.0",
    "qwen-vl-utils>=0.0.14",
    "modelscope",
    "safetensors",
    "datasets",
    "pyarrow",
    "numpy",
    "pillow>=10.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
