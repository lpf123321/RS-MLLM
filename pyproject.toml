[project]
name = "rs-mllm"
version = "0.1.0"
description = "RS-MLLM: 星载遥感多模态大模型轻量化部署"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "transformers>=5.12.0",
    "accelerate>=1.14.0",
    "qwen-vl-utils>=0.0.14",
    "decord",
    "av",
    "pillow>=10.0.0",
    "einops",
    "huggingface_hub",
    "modelscope",
    "requests",
    "deepspeed==0.17.5",
    "peft==0.15.2",
    "bitsandbytes==0.49.2",
    "liger_kernel==0.8.0",
    "trl==0.25.0",
    "datasets",
    "nltk",
    "rouge_score",
    "opencv-python",
    "ujson",
    "wandb",
    "ninja",
    "matplotlib",
    "tensorboardX",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
