[project]
name = "qwen35-finetune"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "deepspeed>=0.17",
    "flash-linear-attention>=0.4.2",
    "ms-swift>=4.3.1",
    "peft>=0.18",
    "qwen-vl-utils>=0.0.14",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers>=5.9",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
