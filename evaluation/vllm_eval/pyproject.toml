[project]
name = "rsmllm-vllm-eval"
version = "0.1.0"
description = "RS-MLLM vLLM 离线评测器环境(报告配置): vllm 0.26 + torch 2.11 cu129 + torchcodec 0.15 cu129"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "vllm==0.26.0",
    "av",
    "safetensors",
    "modelscope",
    "gradio",
    "httpx[socks]",
    "torchcodec==0.15.0+cu129",
    "nltk==3.10.3",
    "rouge-score==0.1.2",
    "qwen-vl-utils==0.0.14",
    "pillow>=10.0.0",
    "pycocoevalcap==1.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
# vllm 0.26 cu129 wheel 使用 SourceForge 的 GitHub release 镜像(仅 Linux x86_64)
# uv.lock 固定 wheel 的 SHA-256, 同步时会校验镜像内容
vllm = { url = "https://downloads.sourceforge.net/project/vllm.mirror/v0.26.0/vllm-0.26.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu129"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
